<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 130" width="100%" height="100%">
  <!-- Container Background -->
  <rect width="600" height="130" fill="#ffffff" />
  
  <!-- Left vertical line and top divider from original UI -->
  <line x1="24" y1="4" x2="24" y2="126" stroke="#c0c4cc" stroke-width="1.5" />
  <line x1="24" y1="22" x2="580" y2="22" stroke="#e2e5ea" stroke-width="1.5" />
  
  <!-- File Icon (Folder / Archive with 2 GB) -->
  <g transform="translate(42, 42)">
    <!-- Folder tab & body -->
    <path d="M2 6 C2 4 3.5 2.5 5.5 2.5 L15 2.5 C17 2.5 18 3.5 19 5 L21 7 L32 7 C34 7 35.5 8.5 35.5 10.5 L35.5 30 C35.5 32 34 33.5 32 33.5 L5.5 33.5 C3.5 33.5 2 32 2 30 Z" fill="#9ea5b0" />
    <path d="M3 11 C3 9.5 4.5 8.5 6 8.5 L32 8.5 C33.5 8.5 35 9.5 35 11 L35 30 C35 31.5 33.5 33 32 33 L6 33 C4.5 33 3 31.5 3 30 Z" fill="#b0b7c3" />
    <!-- 2 GB label box -->
    <rect x="0" y="21" width="36" height="15" rx="1.5" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
    <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="900" fill="#1e293b" text-anchor="middle">2 GB</text>
  </g>
  
  <!-- File Name -->
  <text x="96" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Noto Sans KR', Arial, sans-serif" font-size="19" font-weight="700" fill="#090a0c" letter-spacing="-0.5px">
    황혼서버 클라 0911.zip
  </text>
  
  <!-- Right Actions -->
  <g transform="translate(440, 36)">
    <!-- Hand-drawn style red marker circle around the download icon -->
    <path d="M 44,4 
             C 62,4 78,14 78,31 
             C 78,48 60,57 41,57 
             C 21,57 7,47 7,30 
             C 7,14 22,5 42,4 
             C 52,3.5 63,7 70,12" 
          fill="none" 
          stroke="#d81d24" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Download Icon (arrow into tray) -->
    <g transform="translate(32, 16)">
      <!-- Downward arrow -->
      <line x1="12" y1="4" x2="12" y2="18" stroke="#1c1e21" stroke-width="2.2" stroke-linecap="round" />
      <polyline points="6.5,13 12,18.5 17.5,13" fill="none" stroke="#1c1e21" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Horizontal tray with small upturned lips -->
      <path d="M 3.5,19 L 3.5,23.5 L 20.5,23.5 L 20.5,19" fill="none" stroke="#1c1e21" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <!-- Trash Can Icon -->
    <g transform="translate(86, 17)">
      <!-- Lid handle and top line -->
      <path d="M 7,3 L 11,3" stroke="#232629" stroke-width="1.8" stroke-linecap="round" />
      <line x1="2" y1="6" x2="16" y2="6" stroke="#232629" stroke-width="1.8" stroke-linecap="round" />
      <!-- Can body -->
      <path d="M 3.5,6.5 L 4.5,21.5 C 4.5,22.5 5.5,23 6.5,23 L 11.5,23 C 12.5,23 13.5,22.5 13.5,21.5 L 14.5,6.5" fill="none" stroke="#232629" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Inner vertical ribs -->
      <line x1="7" y1="9.5" x2="7" y2="19.5" stroke="#232629" stroke-width="1.4" stroke-linecap="round" />
      <line x1="11" y1="9.5" x2="11" y2="19.5" stroke="#232629" stroke-width="1.4" stroke-linecap="round" />
    </g>
  </g>
</svg>
